<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="title desc">
  <title id="title">Hush. Your phone. Your peace.</title>
  <desc id="desc">An open-source Android call blocker. A violet shield and a signal line sit beside the title.</desc>
  <defs>
    <radialGradient id="background" cx="89%" cy="44%" r="77%">
      <stop stop-color="#2a1b43"/>
      <stop offset=".58" stop-color="#14111d"/>
      <stop offset="1" stop-color="#0e0d11"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="1" y2="0">
      <stop stop-color="#9874df"/>
      <stop offset="1" stop-color="#e4d2ff"/>
    </linearGradient>
    <linearGradient id="trace">
      <stop stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d7baff"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 H 0 V 32" fill="none" stroke="#c4b5fd" stroke-opacity=".09"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="394" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="396" fill="url(#background)"/>
    <path d="M655 0h545v396H655z" fill="url(#grid)"/>
    <g transform="translate(940 198)" fill="none" stroke="#b99bf5">
      <circle r="167" stroke-opacity=".15"/>
      <circle r="136" stroke-opacity=".23"/>
      <circle r="104" stroke-opacity=".3" stroke-dasharray="3 7"/>
      <path d="M-218 0h122l19-27 21 52 19-25h61l18-19 14 19h163" stroke="url(#trace)" stroke-width="2"/>
      <circle cx="-128" cy="-46" r="4" fill="#b99bf5" stroke="none"/>
      <circle cx="104" cy="-87" r="4" fill="#b99bf5" stroke="none"/>
      <circle cx="125" cy="108" r="3" fill="#b99bf5" stroke="none"/>
      <path d="M0-69c20 14 43 21 64 23v45c0 34-23 59-64 77C-41 58-64 33-64-1v-45c21-2 44-9 64-23Z" fill="#1d142e" stroke="url(#accent)" stroke-width="2"/>
      <path d="m-25 1 17 17 34-36" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <text x="66" y="89" fill="#d9c4ff" font-size="24" font-weight="700" letter-spacing="5">HUSH</text>
      <text x="62" y="178" fill="#faf8ff" font-size="76" font-weight="720" letter-spacing="-3">Your phone.</text>
      <text x="62" y="260" fill="#d6c3f2" font-size="76" font-weight="720" letter-spacing="-3">Your peace.</text>
      <path d="M67 296h45" stroke="#b99bf5" stroke-width="2" stroke-linecap="round"/>
      <text x="65" y="335" fill="#dfd9ea" font-size="23">Open-source call blocking for Android</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="394" rx="26" fill="none" stroke="#3d304e" stroke-width="2"/>
</svg>
